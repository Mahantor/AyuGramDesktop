name: Build Windows

# Debug x64 executable, built against the cached third-party libraries produced by
# "Prepare Windows libraries". AGENTS.md forbids Release builds, so this workflow only does Debug.

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version the cached libraries were built with'
        required: true
        default: '5.15.19'
      toolset:
        description: 'MSVC toolset to prefer'
        required: true
        default: '14.44'
      deps_asset:
        description: 'Release tag holding a prepared ayu-win64-libs zip (skips the library cache)'
        required: false
        default: ''
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT: ${{ inputs.qt_version || '5.15.19' }}
  TOOLSET: ${{ inputs.toolset || '14.44' }}
  # cl /MP without a count spawns one front-end per core per project; the heavy window/*.cpp
  # translation units need about 2 GB each, so on the 16 GB hosted runner MSVC dies with
  # "error C1060: compiler is out of heap space". _CL_MPCount caps /MP, --parallel caps how many
  # projects build at once.
  CL_MP: '2'
  NODES: '2'

jobs:
  build:
    name: AyuGram.exe (Debug x64)
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve toolset, ATL and the vcvars wrapper
        id: msvc
        uses: ./.github/actions/setup-msvc
        with:
          toolset: ${{ env.TOOLSET }}

      # A prepared dependency archive attached to a Release is how the very first build avoids
      # waiting on hours of "Prepare Windows libraries". Public release assets need no extra token.
      - name: Download prepared libraries
        if: inputs.deps_asset != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          # Git for Windows ships a GNU tar as /usr/bin/tar and puts it first on PATH under the
          # bash shell; GNU tar cannot read a zip. The system bsdtar must be named explicitly.
          BSDTAR: $env:SystemRoot\System32\tar.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:RUNNER_TEMP 'deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          gh release download '${{ inputs.deps_asset }}' --repo $env:GITHUB_REPOSITORY `
            --pattern '*.zip' --dir $deps
          $zip = Get-ChildItem $deps -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "no zip asset on release '${{ inputs.deps_asset }}'" }
          & $env:SystemRoot\System32\tar.exe -xf $zip.FullName -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "tar exited $LASTEXITCODE" }
          # The archive was written as Libraries/win64/... ; a slip in that layout would otherwise
          # surface much later as an incomprehensible CMake error.
          $win64 = Join-Path $env:GITHUB_WORKSPACE 'Libraries\win64'
          if (-not (Test-Path $win64)) { throw "the archive did not unpack to $win64" }
          Write-Host ('unpacked ' + ((Get-ChildItem $win64 -Directory).Count) + ' library folders')

      - id: cache
        if: inputs.deps_asset == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          # The last group of a generation is the complete tree, so an exact hit here means the
          # libraries need no rebuilding at all. The group suffix has to match the last matrix
          # group of prepare-windows-libs.yml; rename both together when a stage moves group.
          key: ayu-winlibs-${{ env.QT }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}-7-webrtc-r2
          restore-keys: |
            ayu-winlibs-${{ env.QT }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}-

      - name: Reuse the cached libraries for the parent-of-workspace paths
        uses: ./.github/actions/buildpath
        with:
          action: create

      - name: Check the cached libraries are complete
        shell: powershell
        run: |
          $win64 = Join-Path $env:GITHUB_WORKSPACE 'Libraries\win64'
          # Every name here is a folder the linker of a successful local build actually read from.
          $required = @("Qt-$env:QT", 'tg_owt', 'tg_angle', 'ffmpeg', 'openssl3', 'zlib', 'breakpad',
                        'protobuf', 'tde2e', 'mozjpeg', 'libvpx', 'local')
          $missing = @()
          foreach ($r in $required) {
            if (-not (Test-Path (Join-Path $win64 $r))) { $missing += $r }
          }
          # msys64 is deliberately not required: only prepare.py consumes it, the Telegram target
          # does not, and a dependency archive ships without it.
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'ThirdParty'))) {
            $missing += 'ThirdParty'
          }
          if ($missing.Count -gt 0) {
            Write-Host "No complete dependency set for this generation (missing: $($missing -join ', '))."
            Write-Host 'Either run "Prepare Windows libraries" once, or dispatch this workflow with'
            Write-Host 'deps_asset set to the release tag that carries the prepared ayu-win64-libs zip.'
            exit 1
          }
          $gb = (Get-ChildItem $win64 -Recurse -File -ErrorAction SilentlyContinue |
            Measure-Object Length -Sum).Sum / 1GB
          Write-Host ('libraries on disk: {0:N2} GB under Libraries\win64' -f $gb)

      - name: Configure
        shell: cmd
        run: >
          call "%MSVC_WRAPPER%" cmd /c "cd Telegram &&
          configure.bat x64
          -D TDESKTOP_API_ID=%TELEGRAM_API_ID%
          -D TDESKTOP_API_HASH=%TELEGRAM_API_HASH%"
        env:
          TELEGRAM_API_ID: ${{ secrets.TDESKTOP_API_ID || '2040' }}
          TELEGRAM_API_HASH: ${{ secrets.TDESKTOP_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}

      - name: Build Debug
        shell: cmd
        run: call "%MSVC_WRAPPER%" cmd /c "set _CL_MPCount=%CL_MP%&& cmake --build out --config Debug --target Telegram --parallel %NODES%"

      - name: Executable
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'out\Debug\AyuGram.exe'
          if (-not (Test-Path $exe)) { Write-Host "missing $exe"; exit 1 }
          $i = Get-Item $exe
          Write-Host ('{0} - {1:N1} MB' -f $i.Name, ($i.Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGram-win64-debug
          # The executable is ~500 MB of already-compressed code; level 0 is the fastest store.
          compression-level: 0
          path: out/Debug/AyuGram.exe
          if-no-files-found: error
