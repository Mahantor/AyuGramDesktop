name: Prepare Windows libraries

# Builds the third-party dependencies Telegram Desktop links against
# (Telegram/build/prepare/win.bat) into <BuildPath>/Libraries/win64 and caches them.
#
# Why this is a separate workflow: a cold prepare is one long chain of source builds
# (Qt, ffmpeg, tg_owt, protobuf, ...). On a 4-core hosted runner that chain does not fit into the
# 6 h per-job limit, so it is split into ordered groups that run one after another and each grow
# the same cached tree. Re-running after an interruption resumes: a finished group is skipped, and
# a failed group was stored under a "-partial" key so the next attempt still restores its output.
#
# Run this once per dependency generation, then use "Build Windows" for the executable.

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version the prepare script should build'
        required: true
        default: '5.15.19'
      toolset:
        description: 'MSVC toolset to prefer (14.44 keeps Windows 7 support)'
        required: true
        default: '14.44'

concurrency:
  group: prepare-windows-libs
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT: ${{ inputs.qt_version }}

jobs:
  prepare:
    strategy:
      fail-fast: false
      # Sequential on purpose: every group restores the previous group's cache entry and grows it.
      max-parallel: 1
      # Every name here has to be a stage prepare.py actually registers on Windows: it drops a
      # stage() whose command block has no win: section, and an unknown argument aborts the run.
      # The authoritative set (33) is what prepare.py reports when run from a developer prompt.
      #
      # Each group caches the tree of itself and everything before it, so moving a stage between
      # groups invalidates that group and all later ones: rename their matrix group (keep the last
      # one in sync with the key in build-windows.yml). A restored exact key skips the build, so an
      # outdated key would silently hand on a tree missing the moved stage.
      matrix:
        include:
          - group: 1-tooling
            stages: patches msys64 python NuGet jom gyp
          - group: 2-base
            stages: lzma zlib mozjpeg openssl3 opus rnnoise gas-preprocessor
          - group: 3-codecs
            stages: dav1d openh264 libavif libde265 libwebp libheif libjxl libvpx liblcms2 nv-codec-headers regex
          - group: 4-ffmpeg
            stages: ffmpeg
          - group: 5-crashreporting
            # stackwalk and crashpad are not stages here: prepare.py only registers them when the
            # build-stackwalk option is present or on macOS/Linux.
            stages: openal-soft breakpad
          # cmd expands %QT%, so the stage name follows the dispatch input without a context that
          # is not available inside the matrix definition.
          # tg_angle belongs here, not with WebRTC: the Qt configure line adds
          # -I <tg_angle>/include plus -egl, and Qt's egl precondition
          # "(features.opengl || openvg) && (features.angle || libs.egl)" fails when those headers
          # are absent ("WARNING: Using OpenGL ES 2.0 on Windows without ANGLE"). prepare.py runs
          # the requested stages in registration order, so tg_angle precedes qt_ here too.
          - group: 6-qt
            stages: tg_angle qt_%QT%
          # -r2: tg_angle left this group for the Qt one, so the tree this key used to describe is
          # no longer the complete tree; the new suffix orphans that entry instead of restoring it.
          - group: 7-webrtc-r2
            stages: tg_owt ada protobuf tde2e
    name: libs (${{ matrix.group }})
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve toolset, ATL and the vcvars wrapper
        id: msvc
        uses: ./.github/actions/setup-msvc
        with:
          toolset: ${{ inputs.toolset }}

      - name: Disk space
        shell: powershell
        run: |
          Get-PSDrive | Where-Object { $_.Name -in 'C', 'D' } |
            ForEach-Object { Write-Host ('{0}: free {1:N1} GB' -f $_.Name, ($_.Free / 1GB)) }

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          # The full key means "this group and everything before it is built". The toolset comes
          # from setup-msvc because it can fall back to the installed default.
          key: ayu-winlibs-${{ env.QT }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}-${{ matrix.group }}
          restore-keys: |
            ayu-winlibs-${{ env.QT }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}-

      - name: Point the parent-of-workspace BuildPath at the cached folders
        uses: ./.github/actions/buildpath
        with:
          action: create

      - name: Build group
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call "%MSVC_WRAPPER%" cmd /c "Telegram\build\prepare\win.bat silent ${{ matrix.stages }}"

      - name: What the group produced
        shell: powershell
        run: |
          foreach ($d in @('Libraries', 'ThirdParty')) {
            $p = Join-Path $env:GITHUB_WORKSPACE $d
            if (Test-Path $p) {
              $gb = (Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum).Sum / 1GB
              Write-Host ('{0,-12} {1,6:N2} GB' -f $d, $gb)
            }
          }
          $win64 = Join-Path $env:GITHUB_WORKSPACE 'Libraries\win64'
          if (Test-Path $win64) {
            $names = (Get-ChildItem $win64 -Directory | Select-Object -ExpandProperty Name) -join ' '
            Write-Host "present: $names"
          }

      # Only a finished group may claim the completion key; a timeout or a failing stage is stored
      # as -partial so the next run restores the tree and retries this group from scratch.
      - name: Prune build intermediates
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        # Measured on a complete local dependency tree: Libraries/win64 is 19.0 GB while the
        # linker reads only 2.51 GB from it. The Qt build tree alone (qt_5.15.19) is 8.0 GB and
        # nothing references it - the installed Qt is Qt-5.15.19 (1.45 GB). Object files, debug
        # info and the .git stores of the cloned sources add another ~5 GB. Dropping those keeps
        # the cache under the 10 GB repository quota without losing a single build input.
        run: |
          $win64 = Join-Path $env:GITHUB_WORKSPACE 'Libraries\win64'
          $qtTree = Join-Path $win64 ('qt_' + $env:QT)
          if (Test-Path $qtTree) {
            Remove-Item -LiteralPath $qtTree -Recurse -Force
            Write-Host "removed the Qt build tree: $qtTree"
          }
          $drop = @('.obj', '.o', '.pdb', '.ilk', '.exp', '.pch', '.iobj', '.ipdb')
          $files = Get-ChildItem $win64 -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $drop -contains $_.Extension }
          $mb = ($files | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("pruning {0} intermediate/debug files, {1:N0} MB" -f @($files).Count, $mb)
          $files | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem $win64 -Recurse -Directory -Force -Filter '.git' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Save cache (group complete)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Save cache (partial progress)
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}
